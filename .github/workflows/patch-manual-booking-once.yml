name: patch manual booking once
on:
  push:
    paths:
      - 'scripts/patch-manual-booking.py'
      - '.github/workflows/patch-manual-booking-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manual booking
        run: python3 scripts/patch-manual-booking.py
      - name: Verify JavaScript
        run: |
          node --check booking-drag.js
          node --check admin-booking-calendar.js
          python3 - <<'PY'
          import re
          s=open('admin.html').read()
          blocks=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          main=next(x for x in blocks if 'const LIFF_ID' in x)
          open('/tmp/admin-module.mjs','w').write(main)
          PY
          node --check /tmp/admin-module.mjs
          grep -q "nakano_admin_create_booking" admin.html
          grep -q "adminTimeButtons" admin.html
          grep -q "不明なら空欄でOK" admin.html
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html booking-drag.js admin-booking-calendar.js
          git commit -m 'Improve manual booking entry and refresh' || true
          git rm -f scripts/patch-manual-booking.py .github/workflows/patch-manual-booking-once.yml
          git commit -m 'Remove temporary manual booking patch files [skip ci]'
          git push
