name: remove legacy block drag once
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy blocked drag UI
        run: python .github/scripts/remove_legacy_block_drag.py
      - name: Verify
        run: |
          ! grep -q 'class="blockedMoveHandle"' admin.html
          ! grep -q 'class="blockedMoveHandle"' bookings.html
          ! grep -q '^ *bindDirectBlockedMove(' admin.html
      - name: Commit patch and cleanup
        run: |
          rm -f .github/scripts/remove_legacy_block_drag.py .github/workflows/remove-legacy-block-drag-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html bookings.html .github/scripts/remove_legacy_block_drag.py .github/workflows/remove-legacy-block-drag-once.yml
          git commit -m "Remove legacy blocked drag handlers [skip ci]"
          git push
