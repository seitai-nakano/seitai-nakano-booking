name: update share copy once
on:
  push:
    paths:
      - '.github/workflows/update-share-copy-once.yml'
      - '.github/scripts/update_share_copy_once.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/update_share_copy_once.py
      - name: Verify
        run: grep -q '知り合いなら紹介で案内してもらえるみたい' index.html
      - name: Commit patch and cleanup
        run: |
          rm -f .github/scripts/update_share_copy_once.py .github/workflows/update-share-copy-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update customer referral share copy [skip ci]' || exit 0
          git push
