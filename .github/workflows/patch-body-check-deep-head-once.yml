name: patch body check deep head once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-body-check-deep-head-once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch recommendations
        run: python .github/patch-body-check-deep-head.py
      - name: Verify
        run: |
          grep -q "deep:\['m120h','m90h','m60h'\]" index.html
      - name: Commit and cleanup
        run: |
          rm -f .github/patch-body-check-deep-head.py .github/workflows/patch-body-check-deep-head-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          git commit -m "Prioritize 120 head for deep body check [skip ci]"
          git push
