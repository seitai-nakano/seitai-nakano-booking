name: patch admin past over blocks once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-past-over-blocks-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin manual time loader
        run: python3 scripts/patch-admin-past-over-blocks.py
      - name: Verify patch
        run: |
          grep -q "nakano_admin_available_slots" admin.html
          grep -q "adminTimeButtons" admin.html
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Allow admin manual booking over plans and in past"
          git rm .github/workflows/patch-admin-past-over-blocks-once.yml scripts/patch-admin-past-over-blocks.py
          git commit -m "Remove temporary admin past booking files [skip ci]"
          git push
