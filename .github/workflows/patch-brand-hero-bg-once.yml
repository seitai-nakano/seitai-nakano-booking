name: patch brand hero background once
on:
  push:
    paths:
      - '.github/workflows/patch-brand-hero-bg-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hero background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('customer-brand.css')
          s=p.read_text()
          old='.brandHero{position:relative;overflow:hidden;background:#fff;border:1px solid var(--nk-line);'
          new='.brandHero{position:relative;overflow:hidden;background:#fbf7f1;border:1px solid var(--nk-line);'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: grep -q 'brandHero{position:relative;overflow:hidden;background:#fbf7f1' customer-brand.css
      - name: Commit and cleanup
        run: |
          rm .github/workflows/patch-brand-hero-bg-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-brand.css .github/workflows/patch-brand-hero-bg-once.yml
          git commit -m 'Warm booking hero background [skip ci]'
          git push
