name: patch mascot wander once
on:
  push:
    paths:
      - '.github/workflows/patch-mascot-wander-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mascot movement and background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''.bookingGuide{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(14px,calc(env(safe-area-inset-bottom) + 12px));z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}.bookingGuideBubble{width:min(300px,calc(100vw - 106px));padding:11px 12px;border:1px solid #e3dbd2;border-radius:14px;background:rgba(255,255,255,.98);box-shadow:0 8px 28px rgba(54,43,35,.12);color:#514a44;font-size:12px;line-height:1.6;opacity:0;transform:translateY(7px) scale(.98);transition:opacity .16s ease,transform .16s ease;pointer-events:none}.bookingGuide.open .bookingGuideBubble{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.bookingGuideText{font-weight:700}.bookingGuideLink{display:block;margin-top:7px;padding-top:7px;border-top:1px solid #eee7df;color:#6b302d;font-weight:800;text-decoration:none}.bookingGuideMascotBtn{width:76px;height:76px;border:1px solid #e1d8cf;border-radius:50%;background:#fff;box-shadow:0 5px 18px rgba(54,43,35,.14);padding:4px;pointer-events:auto;animation:bookingGuidePulse 4.6s ease-in-out infinite;touch-action:manipulation}.bookingGuideMascot{display:block;width:100%;height:100%;transform-origin:50% 88%;animation:bookingMascotFloat 2.7s ease-in-out infinite}.bookingGuideEye{transform-box:fill-box;transform-origin:center;animation:bookingMascotBlink 4.8s infinite}.bookingGuideCheek{animation:bookingMascotCheek 2.8s ease-in-out infinite}.bookingGuide.thinking .bookingGuideMascot{animation:bookingMascotThink .45s ease-in-out infinite alternate}.bookingGuide.done .bookingGuideMascot{animation:bookingMascotDone .78s cubic-bezier(.2,.8,.3,1.2) 1,bookingMascotFloat 2.7s .78s ease-in-out infinite}@keyframes bookingMascotFloat{0%,100%{transform:translateY(0) rotate(-2deg)}25%{transform:translateY(-4px) rotate(1.5deg)}50%{transform:translateY(-8px) rotate(2.4deg)}75%{transform:translateY(-4px) rotate(-1deg)}}@keyframes bookingGuidePulse{0%,100%{box-shadow:0 6px 20px rgba(54,43,35,.16);transform:scale(1)}50%{box-shadow:0 9px 28px rgba(54,43,35,.22);transform:scale(1.045)}}@keyframes bookingMascotBlink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}@keyframes bookingMascotCheek{0%,100%{opacity:.55}50%{opacity:1}}@keyframes bookingMascotThink{from{transform:translateY(-2px) rotate(-6deg) scale(1.02)}to{transform:translateY(-5px) rotate(6deg) scale(1.05)}}@keyframes bookingMascotDone{0%{transform:translateY(0) scale(1) rotate(0)}38%{transform:translateY(-13px) scale(1.10) rotate(-5deg)}62%{transform:translateY(-6px) scale(1.04) rotate(5deg)}82%{transform:translateY(2px) scale(.98) rotate(-2deg)}100%{transform:translateY(0) scale(1) rotate(0)}}@media(prefers-reduced-motion:reduce){.bookingGuideMascotBtn,.bookingGuideMascot,.bookingGuideEye,.bookingGuideCheek,.bookingGuide.thinking .bookingGuideMascot,.bookingGuide.done .bookingGuideMascot{animation:none!important}}'''
          new='''.bookingGuide{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(14px,calc(env(safe-area-inset-bottom) + 12px));z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}.bookingGuideBubble{width:min(300px,calc(100vw - 106px));padding:11px 12px;border:1px solid #dccfc2;border-radius:14px;background:rgba(248,241,234,.98);box-shadow:0 8px 28px rgba(83,53,38,.15);color:#514a44;font-size:12px;line-height:1.6;opacity:0;transform:translateY(7px) scale(.98);transition:opacity .16s ease,transform .16s ease;pointer-events:none}.bookingGuide.open .bookingGuideBubble{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.bookingGuideText{font-weight:700}.bookingGuideLink{display:block;margin-top:7px;padding-top:7px;border-top:1px solid #e2d6ca;color:#6b302d;font-weight:800;text-decoration:none}.bookingGuideMascotBtn{width:78px;height:78px;border:1px solid #d8c2b0;border-radius:50%;background:linear-gradient(145deg,#f4e7dc 0%,#e6d0bf 58%,#dcbca7 100%);box-shadow:0 8px 24px rgba(91,53,35,.20),inset 0 1px 0 rgba(255,255,255,.6);padding:4px;pointer-events:auto;animation:bookingGuideWander 6.6s ease-in-out infinite;touch-action:manipulation;will-change:transform}.bookingGuideMascot{display:block;width:100%;height:100%;transform-origin:50% 88%;animation:bookingMascotFloat 3.1s ease-in-out infinite}.bookingGuideEye{transform-box:fill-box;transform-origin:center;animation:bookingMascotBlink 4.8s infinite}.bookingGuideCheek{animation:bookingMascotCheek 2.8s ease-in-out infinite}.bookingGuide.thinking .bookingGuideMascot{animation:bookingMascotThink .42s ease-in-out infinite alternate}.bookingGuide.done .bookingGuideMascot{animation:bookingMascotDone .82s cubic-bezier(.2,.8,.3,1.2) 1,bookingMascotFloat 3.1s .82s ease-in-out infinite}@keyframes bookingGuideWander{0%,100%{transform:translate3d(0,0,0) rotate(0) scale(1);box-shadow:0 8px 24px rgba(91,53,35,.20)}12%{transform:translate3d(-6px,-3px,0) rotate(-2deg) scale(1.02)}26%{transform:translate3d(-14px,-9px,0) rotate(2deg) scale(1.04);box-shadow:0 12px 30px rgba(91,53,35,.25)}40%{transform:translate3d(-9px,-14px,0) rotate(-1deg) scale(1.02)}54%{transform:translate3d(1px,-8px,0) rotate(2deg) scale(1.04)}68%{transform:translate3d(-5px,-2px,0) rotate(-2deg) scale(1)}82%{transform:translate3d(-12px,-6px,0) rotate(1deg) scale(1.035)}92%{transform:translate3d(-4px,-10px,0) rotate(-1deg) scale(1.015)}}@keyframes bookingMascotFloat{0%,100%{transform:translate3d(0,0,0) rotate(-3deg)}18%{transform:translate3d(2px,-3px,0) rotate(1deg)}36%{transform:translate3d(-1px,-7px,0) rotate(3deg)}52%{transform:translate3d(2px,-9px,0) rotate(0)}70%{transform:translate3d(-2px,-5px,0) rotate(-3deg)}86%{transform:translate3d(1px,-2px,0) rotate(2deg)}}@keyframes bookingMascotBlink{0%,42%,46%,72%,76%,100%{transform:scaleY(1)}44%,74%{transform:scaleY(.1)}}@keyframes bookingMascotCheek{0%,100%{opacity:.52}50%{opacity:1}}@keyframes bookingMascotThink{from{transform:translate3d(-2px,-3px,0) rotate(-8deg) scale(1.03)}to{transform:translate3d(3px,-7px,0) rotate(8deg) scale(1.07)}}@keyframes bookingMascotDone{0%{transform:translateY(0) scale(1) rotate(0)}34%{transform:translateY(-15px) scale(1.12) rotate(-7deg)}58%{transform:translateY(-7px) scale(1.05) rotate(7deg)}80%{transform:translateY(3px) scale(.97) rotate(-3deg)}100%{transform:translateY(0) scale(1) rotate(0)}}@media(prefers-reduced-motion:reduce){.bookingGuideMascotBtn,.bookingGuideMascot,.bookingGuideEye,.bookingGuideCheek,.bookingGuide.thinking .bookingGuideMascot,.bookingGuide.done .bookingGuideMascot{animation:none!important}}'''
          if old not in s:
              raise SystemExit('old mascot css not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'bookingGuideWander' index.html
          grep -q 'linear-gradient(145deg,#f4e7dc' index.html
      - name: Commit and cleanup
        run: |
          rm .github/workflows/patch-mascot-wander-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/patch-mascot-wander-once.yml
          git commit -m 'Make booking mascot wander with warm background [skip ci]'
          git push
