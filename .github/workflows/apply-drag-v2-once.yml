name: apply direct mascot drag once
on:
  push:
    paths:
      - '.github/workflows/apply-drag-v2-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply direct drag patch
        run: python3 .tmp_patch_drag_v2.py
      - name: Verify
        run: |
          grep -q "function bookingGuideInstallDirectDrag" index.html
          grep -q "bookingGuideInstallDirectDrag();" index.html
          grep -q "nakano_booking_guide_direct_pos_v1" index.html
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-drag-v2-once.yml .tmp_patch_drag_v2.py
          git add index.html
          git commit -m 'Use direct-position mascot drag on mobile [skip ci]'
          git push
