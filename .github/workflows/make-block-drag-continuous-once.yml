name: make block drag continuous once
on:
  push:
    paths:
      - '.github/workflows/make-block-drag-continuous-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch actual block drag
        run: python3 .github/scripts/make_block_drag_continuous.py
      - name: Verify markers
        run: |
          grep -q 'actual red block follows the finger continuously' blocked-drag.js
          grep -q 'Move the actual block itself' blocked-drag.js
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/make-block-drag-continuous-once.yml
          git rm .github/scripts/make_block_drag_continuous.py
          git add blocked-drag.js
          git commit -m 'Make blocked plan card follow finger continuously [skip ci]'
          git push
