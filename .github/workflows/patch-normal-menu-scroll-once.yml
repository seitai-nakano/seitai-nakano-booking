name: patch normal menu scroll once
on:
  push:
    paths:
      - '.github/workflows/patch-normal-menu-scroll-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch normal menu auto advance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="b.onclick=()=>{if(bookingInProgress)return;document.querySelectorAll('.menu').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedMenu=menu;selectedTime=null;$('confirmCard').classList.add('hidden');loadSlots()};"
          new="b.onclick=()=>{if(bookingInProgress)return;document.querySelectorAll('.menu').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedMenu=menu;selectedTime=null;$('confirmCard').classList.add('hidden');loadSlots();setTimeout(()=>{const dateCard=$('date').closest('.card');if(dateCard){const top=dateCard.getBoundingClientRect().top+window.scrollY-18;window.scrollTo({top,behavior:'smooth'})}},120)};"
          if old not in s:
              raise SystemExit('target menu click handler not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify
        run: |
          grep -F "const dateCard=\$('date').closest('.card')" index.html
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-normal-menu-scroll-once.yml
          git commit -m "Auto-advance normal menu selection to date [skip ci]"
          git push
