name: patch body check once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-body-check-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch body check
        run: python3 .github/patch-body-check.py
      - name: Verify
        run: |
          grep -q "お体チェック" index.html
          grep -q "bodyCheckRecommendation" index.html
          grep -q "data-menu-id" index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'どのメニューを選べばいいかわからない方へ' not in s
          assert '医療上の診断ではありません' in s
          assert '<html' in s.lower() and '</html>' in s.lower()
          PY
      - name: Check module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          Path('/tmp/index-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/index-module.mjs
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace menu guide with body check recommendation"
          git rm .github/patch-body-check.py .github/workflows/patch-body-check-once.yml
          git commit -m "Remove temporary body check files [skip ci]"
          git push
