name: patch menu guide once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-menu-guide-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch menu guide
        run: python3 .github/patch-menu-guide.py
      - name: Verify
        run: |
          grep -q "どのメニューを選べばいいかわからない方へ" index.html
          grep -q "menuGuide" index.html
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add customer menu selection guide"
          git rm .github/patch-menu-guide.py .github/workflows/patch-menu-guide-once.yml
          git commit -m "Remove temporary menu guide files [skip ci]"
          git push
