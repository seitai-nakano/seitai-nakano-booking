name: robust long press scroll once
on:
  push:
    paths:
      - 'scripts/patch-longpress-scroll.py'
      - '.github/workflows/patch-longpress-scroll-once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch-longpress-scroll.py
      - name: Verify markers
        run: |
          grep -q "const LONG_PRESS_MS=500" blocked-drag.js
          grep -q "s.scrolling=true" blocked-drag.js
          grep -q "touch-action:pan-y" blocked-drag.js
      - name: Commit patch and cleanup
        run: |
          rm -f scripts/patch-longpress-scroll.py .github/workflows/patch-longpress-scroll-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix iPhone long press drag and red-block scrolling [skip ci]"
          git push
