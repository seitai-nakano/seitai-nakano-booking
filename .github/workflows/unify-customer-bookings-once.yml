name: unify customer bookings once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-customer-bookings-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python3 .github/patch-unify-customer-bookings.py
      - name: Verify
        run: |
          grep -q "p_customer_id" admin.html
          grep -q "mergeUnlinkedBookings" customers.html
          python3 - <<'PY'
          from pathlib import Path
          for f in ['admin.html','customers.html']:
              s=Path(f).read_text()
              assert '<html' in s.lower() and '</html>' in s.lower()
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html customers.html
          git commit -m "Unify manual and online bookings by customer"
          git rm .github/patch-unify-customer-bookings.py .github/workflows/unify-customer-bookings-once.yml
          git commit -m "Remove temporary booking unification files [skip ci]"
          git push
