name: switch to past booking checkout once
on:
  push:
    paths:
      - '.github/workflows/switch-to-past-booking-checkout-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply correction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('checkout.html')
          s=p.read_text()
          s=s.replace('<script type="module" src="./manual-checkout.js?v=20260910-1"></script>','<script type="module" src="./past-booking-checkout.js?v=20260910-1"></script>')
          p.write_text(s)
          PY
          rm -f manual-checkout.js
      - name: Verify
        run: |
          grep -q 'past-booking-checkout.js' checkout.html
          ! grep -q 'manual-checkout.js' checkout.html
          test ! -f manual-checkout.js
      - name: Commit correction and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkout.html past-booking-checkout.js
          git rm -f manual-checkout.js .github/workflows/switch-to-past-booking-checkout-once.yml
          git commit -m 'Use past reservations for manual checkout [skip ci]'
          git push
