<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
  'https://scjzofjyxmchfjsngqtb.supabase.co',
  'sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9'
);

const DAY_START=8*60;
const DAY_END=22*60;
const hours=[];
for(let h=8;h<22;h++)hours.push(h);

let slots=[];
let bookings=[];
let blocked=[];
let busy=false;
let toastTimer=null;
let swipeGesture=null;
let selectedBlockedDates=new Set();

const UNDO_KEY='nakano_open_close_undo_v1';
const UNDO_LIMIT=10;

const $=id=>document.getElementById(id);

function readUndoStack(){
  try{
    const value=JSON.parse(localStorage.getItem(UNDO_KEY)||'[]');
    return Array.isArray(value)?value:[];
  }catch(_){
    return [];
  }
}

function writeUndoStack(stack){
  try{
    localStorage.setItem(UNDO_KEY,JSON.stringify(stack.slice(-UNDO_LIMIT)));
  }catch(_){}
}

function pushUndo(label,rows){
  if(!Array.isArray(rows)||!rows.length)return;
  const stack=readUndoStack();
  stack.push({
    label:String(label||'変更'),
    rows:rows.map(row=>({
      slot_date:String(row.slot_date),
      start_time:String(row.start_time),
      is_open:!!row.is_open
    })),
    at:Date.now()
  });
  writeUndoStack(stack);
  updateUndoButton();
}

function updateUndoButton(){
  const stack=readUndoStack();
  const btn=$('undoBtn');
  const caption=$('undoCaption');
  if(btn)btn.disabled=!stack.length;
  if(caption){
    caption.textContent=stack.length
      ? '戻せる変更：'+String(stack[stack.length-1].label||'直前の変更')
      : '';
  }
}

function snapshotCurrentTimes(date,times){
  const map=slotMap();
  return times.map(time=>({
    slot_date:date,
    start_time:time,
    is_open:!!map.get(time)?.is_open
  }));
}

async function restoreUndoRows(rows){
  for(let i=0;i<rows.length;i+=500){
    const {error}=await supabase
      .from('nakano_open_slots')
      .upsert(rows.slice(i,i+500),{onConflict:'slot_date,start_time'});
    if(error)throw error;
  }
}

async function undoLastChange(){
  if(busy)return;
  const stack=readUndoStack();
  const action=stack[stack.length-1];
  if(!action?.rows?.length)return;

  busy=true;
  $('undoBtn').disabled=true;

  let restored=false;
  try{
    await restoreUndoRows(action.rows);
    stack.pop();
    writeUndoStack(stack);
    restored=true;
  }catch(error){
    console.error(error);
    showToast('戻せませんでした');
  }finally{
    busy=false;
    updateUndoButton();
  }

  if(restored){
    await loadDay(false);
    showToast('1つ前の状態に戻しました');
  }
}

function todayJapan(){
  const parts=new Intl.DateTimeFormat('en-US',{
    timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'
  }).formatToParts(new Date());
  const get=type=>parts.find(p=>p.type===type)?.value||'';
  return get('year')+'-'+get('month')+'-'+get('day');
}

function addDays(date,days){
  const parts=date.split('-').map(Number);
  const d=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}

function monthFromDate(date){
  return String(date||'').slice(0,7);
}

function nextMonthStart(month){
  const parts=month.split('-').map(Number);
  const d=new Date(Date.UTC(parts[0],parts[1],1));
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-01';
}

function datesInMonth(month){
  if(!/^\d{4}-\d{2}$/.test(String(month||'')))return [];
  const [year,mon]=month.split('-').map(Number);
  const last=new Date(Date.UTC(year,mon,0)).getUTCDate();
  return Array.from({length:last},(_,i)=>month+'-'+String(i+1).padStart(2,'0'));
}

function esc(value){
  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function hhmm(minutes){
  return String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0')+':00';
}

function toMinutes(time){
  const p=String(time||'00:00').slice(0,5).split(':').map(Number);
  return p[0]*60+p[1];
}

function showToast(text){
  clearTimeout(toastTimer);
  $('toast').textContent=text;
  $('toast').classList.add('show');
  toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1400);
}

function slotMap(){
  return new Map(slots.map(x=>[String(x.start_time),x]));
}

function busyAt(startMin,endMin){
  const bookingCount=bookings.filter(b=>{
    const s=toMinutes(b.start_time);
    const duration=Math.max(15,Number(b.minutes)||30);
    return s<endMin&&s+duration>startMin;
  }).length;

  const blockedCount=blocked.filter(b=>{
    const s=toMinutes(b.start_time);
    let e=toMinutes(b.end_time);
    if(String(b.end_time).startsWith('23:59'))e=24*60;
    return s<endMin&&e>startMin;
  }).length;

  return {bookingCount,blockedCount};
}

function stateForHour(hour){
  const map=slotMap();
  const quarter=[];
  for(let m=0;m<60;m+=15){
    const t=hhmm(hour*60+m);
    const open=!!map.get(t)?.is_open;
    const busyInfo=busyAt(hour*60+m,hour*60+m+15);
    quarter.push({
      time:t,
      open,
      busy:busyInfo.bookingCount>0||busyInfo.blockedCount>0
    });
  }
  const count=quarter.filter(x=>x.open).length;
  return {
    quarter,
    count,
    type:count===4?'allOpen':count===0?'allClosed':'mixed'
  };
}

function renderSummary(){
  const map=slotMap();
  let open=0,closed=0;
  for(let min=DAY_START;min<DAY_END;min+=15){
    if(map.get(hhmm(min))?.is_open)open++;
    else closed++;
  }
  $('summary').innerHTML=
    '<span class="badge open">OPEN '+open+'</span>'+
    '<span class="badge closed">CLOSE '+closed+'</span>'+
    '<span class="badge booking">予約 '+bookings.length+'</span>'+
    '<span class="badge blocked">予定 '+blocked.length+'</span>';
}

function render(){
  const grid=$('hourGrid');
  grid.innerHTML='';
  const map=slotMap();
  let index=0;

  hours.forEach(hour=>{
    const row=document.createElement('div');
    row.className='hourRow';

    const head=document.createElement('div');
    head.className='hourRowHead';

    const label=document.createElement('div');
    label.className='hourRowLabel';
    label.textContent=hour+'時';

    const openCount=[0,15,30,45].filter(minute=>!!map.get(hhmm(hour*60+minute))?.is_open).length;
    const state=document.createElement('div');
    state.className='hourRowState';
    state.textContent=openCount===4?'全部OPEN':openCount===0?'全部CLOSE':openCount+'/4 OPEN';

    head.append(label,state);

    const quarterGrid=document.createElement('div');
    quarterGrid.className='quarterGrid';

    [0,15,30,45].forEach(minute=>{
      const total=hour*60+minute;
      const time=hhmm(total);
      const isOpen=!!map.get(time)?.is_open;
      const busyInfo=busyAt(total,total+15);
      const isBusy=busyInfo.bookingCount>0||busyInfo.blockedCount>0;

      const card=document.createElement('div');
      card.className='quarterCard '+(isBusy?'locked':(isOpen?'open':'closed'));
      card.dataset.time=time;
      card.dataset.index=String(index++);
      card.dataset.locked=isBusy?'1':'0';

      const inner=document.createElement('div');
      inner.className='quarterInner';
      const stateLabel=busyInfo.bookingCount?'予約':busyInfo.blockedCount?'予定':isOpen?'OPEN':'CLOSE';
      inner.innerHTML=
        '<div class="quarterTime">'+String(minute).padStart(2,'0')+'</div>'+
        '<div class="quarterState">'+stateLabel+'</div>';

      card.appendChild(inner);

      if(isBusy){
        const busyDot=document.createElement('span');
        busyDot.className='quarterBusy';
        busyDot.title=busyInfo.bookingCount?'予約あり':'予定あり';
        card.appendChild(busyDot);
      }

      quarterGrid.appendChild(card);
    });

    row.append(head,quarterGrid);
    grid.appendChild(row);
  });

  renderSummary();
  $('loading').classList.add('hidden');
  grid.classList.remove('hidden');
}

function allQuarterCards(){
  return [...document.querySelectorAll('.quarterCard[data-index]')];
}

function clearRangePreview(){
  document.querySelectorAll('.rangePreviewOpen,.rangePreviewClose,.rangePreviewSkip').forEach(el=>{
    el.classList.remove('rangePreviewOpen','rangePreviewClose','rangePreviewSkip');
  });
}

function previewSwipeRange(startIndex,endIndex,open){
  clearRangePreview();
  const cards=allQuarterCards();
  const from=Math.min(startIndex,endIndex);
  const to=Math.max(startIndex,endIndex);

  for(let i=from;i<=to;i++){
    const card=cards[i];
    if(!card)continue;
    if(open&&card.dataset.locked==='1')card.classList.add('rangePreviewSkip');
    else card.classList.add(open?'rangePreviewOpen':'rangePreviewClose');
  }
}

function cardAtPoint(x,y){
  const el=document.elementFromPoint(x,y);
  return el?.closest?.('.quarterCard[data-index]')||null;
}

function bindSwipeGrid(){
  const grid=$('hourGrid');

  grid.addEventListener('pointerdown',event=>{
    if(busy)return;
    const card=event.target.closest?.('.quarterCard[data-index]');
    if(!card)return;
    if(event.pointerType==='mouse'&&event.button!==0)return;

    swipeGesture={
      pointerId:event.pointerId,
      startIndex:Number(card.dataset.index),
      endIndex:Number(card.dataset.index),
      startX:event.clientX,
      startY:event.clientY,
      direction:null
    };
  });

  grid.addEventListener('pointermove',event=>{
    if(!swipeGesture||swipeGesture.pointerId!==event.pointerId)return;

    const dx=event.clientX-swipeGesture.startX;
    const dy=event.clientY-swipeGesture.startY;

    if(!swipeGesture.direction){
      if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>10)return;
      if(Math.abs(dx)<12)return;
      swipeGesture.direction=dx>0?'open':'close';
      try{grid.setPointerCapture(event.pointerId)}catch(_){}
    }

    event.preventDefault();

    const card=cardAtPoint(event.clientX,event.clientY);
    if(card){
      const index=Number(card.dataset.index);
      if(Number.isFinite(index))swipeGesture.endIndex=index;
    }else{
      // 指がカード外へ出ても横移動量に応じて複数枠をまとめて選択できるようにする
      const step=Math.max(0,Math.floor(Math.abs(dx)/34));
      swipeGesture.endIndex=swipeGesture.direction==='open'
        ? Math.min(allQuarterCards().length-1,swipeGesture.startIndex+step)
        : Math.max(0,swipeGesture.startIndex-step);
    }

    previewSwipeRange(
      swipeGesture.startIndex,
      swipeGesture.endIndex,
      swipeGesture.direction==='open'
    );
  },{passive:false});

  const finish=async event=>{
    if(!swipeGesture||swipeGesture.pointerId!==event.pointerId)return;

    const gesture=swipeGesture;
    swipeGesture=null;
    try{grid.releasePointerCapture(event.pointerId)}catch(_){}

    clearRangePreview();

    if(!gesture.direction)return;

    const cards=allQuarterCards();
    const from=Math.min(gesture.startIndex,gesture.endIndex);
    const to=Math.max(gesture.startIndex,gesture.endIndex);
    let selected=cards.slice(from,to+1);

    const open=gesture.direction==='open';
    const skipped=open?selected.filter(card=>card.dataset.locked==='1').length:0;
    if(open)selected=selected.filter(card=>card.dataset.locked!=='1');

    const times=selected.map(card=>String(card.dataset.time||'')).filter(Boolean);
    if(!times.length){
      if(skipped)showToast('予約・予定があるためOPENできません');
      return;
    }

    await applySwipeTimes(times,open,skipped);
  };

  grid.addEventListener('pointerup',finish);
  grid.addEventListener('pointercancel',()=>{
    swipeGesture=null;
    clearRangePreview();
  });
}

async function applySwipeTimes(times,open,skipped=0){
  if(busy||!times.length)return;

  const date=$('date').value;
  const before=snapshotCurrentTimes(date,times);
  const rows=times.map(time=>({
    slot_date:date,
    start_time:time,
    is_open:open
  }));

  const changed=before.some((row,i)=>row.is_open!==rows[i].is_open);
  if(!changed){
    showToast('すでに'+(open?'OPEN':'CLOSE')+'です');
    return;
  }

  busy=true;
  try{
    const {error}=await supabase
      .from('nakano_open_slots')
      .upsert(rows,{onConflict:'slot_date,start_time'});
    if(error)throw error;

    const first=String(times[0]).slice(0,5);
    const last=String(times[times.length-1]).slice(0,5);
    pushUndo(first+(times.length>1?'〜'+last:'')+' '+(open?'OPEN':'CLOSE'),before);
    showToast(
      times.length+'枠を'+(open?'OPEN':'CLOSE')+
      (skipped?'（予約・予定 '+skipped+'枠は除外）':'')
    );
  }catch(error){
    console.error(error);
    showToast('変更できませんでした');
  }finally{
    busy=false;
  }

  await loadDay(false);
}

function currentBusyTimes(){
  const result=new Set();
  for(let min=DAY_START;min<DAY_END;min+=15){
    const info=busyAt(min,min+15);
    if(info.bookingCount||info.blockedCount)result.add(hhmm(min));
  }
  return result;
}


async function loadDay(showLoading=true){
  if(busy)return;
  const date=$('date').value;
  if(!date)return;

  if(showLoading){
    $('loading').classList.remove('hidden');
    $('hourGrid').classList.add('hidden');
  }

  const [slotResult,bookingResult,blockedResult]=await Promise.all([
    supabase.from('nakano_open_slots').select('start_time,is_open').eq('slot_date',date),
    supabase.from('nakano_bookings').select('id,start_time,minutes,status').eq('booking_date',date).eq('status','confirmed'),
    supabase.from('nakano_blocked_times').select('id,start_time,end_time').eq('blocked_date',date)
  ]);

  if(slotResult.error||bookingResult.error||blockedResult.error){
    console.error(slotResult.error,bookingResult.error,blockedResult.error);
    $('loading').textContent='読み込めませんでした。';
    $('loading').classList.remove('hidden');
    return;
  }

  slots=slotResult.data||[];
  bookings=bookingResult.data||[];
  blocked=blockedResult.data||[];

  $('month').value=monthFromDate(date);
  render();
}

async function setWholeDay(open){
  if(busy)return;
  const date=$('date').value;
  const times=[];
  for(let min=DAY_START;min<DAY_END;min+=15)times.push(hhmm(min));
  const before=snapshotCurrentTimes(date,times);
  busy=true;
  const rows=[];
  for(let min=DAY_START;min<DAY_END;min+=15){
    rows.push({slot_date:date,start_time:hhmm(min),is_open:open});
  }
  const {error}=await supabase.from('nakano_open_slots').upsert(rows,{onConflict:'slot_date,start_time'});
  busy=false;
  if(error){
    console.error(error);
    showToast('変更できませんでした');
    return;
  }
  pushUndo(open?'全時間OPEN':'全日CLOSE',before);
  showToast(open?'全時間OPEN':'全日CLOSE');
  await loadDay(false);
}

async function setNormalHours(){
  if(busy)return;
  const date=$('date').value;
  const times=[];
  for(let min=DAY_START;min<DAY_END;min+=15)times.push(hhmm(min));
  const before=snapshotCurrentTimes(date,times);
  busy=true;
  const locked=currentBusyTimes();
  const rows=[];
  for(let min=DAY_START;min<DAY_END;min+=15){
    const time=hhmm(min);
    rows.push({
      slot_date:date,
      start_time:time,
      is_open:min>=10*60&&min<20*60+15&&!locked.has(time)
    });
  }
  const {error}=await supabase.from('nakano_open_slots').upsert(rows,{onConflict:'slot_date,start_time'});
  busy=false;
  if(error){
    console.error(error);
    showToast('変更できませんでした');
    return;
  }
  pushUndo('通常営業時間 10:00〜20:00',before);
  showToast('通常営業時間に設定しました');
  await loadDay(false);
}

async function setMonth(normal){
  const month=$('month').value;
  if(!month||busy)return;

  const message=normal
    ? month+' を通常営業時間（10:00〜20:00）で設定しますか？'
    : month+' を全部CLOSEにしますか？';
  if(!confirm(message))return;

  busy=true;
  $('monthMsg').textContent='変更しています…';

  let beforeMonth=[];
  try{
    const start=month+'-01';
    const end=nextMonthStart(month);

    const [beforeResult,bookingResult,blockedResult]=await Promise.all([
      supabase
        .from('nakano_open_slots')
        .select('slot_date,start_time,is_open')
        .gte('slot_date',start)
        .lt('slot_date',end),
      supabase
        .from('nakano_bookings')
        .select('booking_date,start_time,minutes,status')
        .gte('booking_date',start)
        .lt('booking_date',end)
        .eq('status','confirmed'),
      supabase
        .from('nakano_blocked_times')
        .select('blocked_date,start_time,end_time')
        .gte('blocked_date',start)
        .lt('blocked_date',end)
    ]);
    if(beforeResult.error||bookingResult.error||blockedResult.error){
      throw beforeResult.error||bookingResult.error||blockedResult.error;
    }
    beforeMonth=beforeResult.data||[];

    const occupied=new Set();
    for(const booking of bookingResult.data||[]){
      const begin=toMinutes(booking.start_time);
      const finish=begin+Math.max(15,Number(booking.minutes)||15);
      for(let min=DAY_START;min<DAY_END;min+=15){
        if(min<finish&&min+15>begin)occupied.add(String(booking.booking_date)+'|'+hhmm(min));
      }
    }
    for(const item of blockedResult.data||[]){
      const begin=toMinutes(item.start_time);
      let finish=toMinutes(item.end_time);
      if(String(item.end_time).startsWith('23:59'))finish=24*60;
      for(let min=DAY_START;min<DAY_END;min+=15){
        if(min<finish&&min+15>begin)occupied.add(String(item.blocked_date)+'|'+hhmm(min));
      }
    }

    const d=new Date(start+'T00:00:00Z');
    const endDate=new Date(end+'T00:00:00Z');
    const rows=[];

    while(d<endDate){
      const date=d.toISOString().slice(0,10);
      for(let min=DAY_START;min<DAY_END;min+=15){
        const time=hhmm(min);
        rows.push({
          slot_date:date,
          start_time:time,
          is_open:normal
            ? (min>=10*60&&min<20*60+15&&!occupied.has(date+'|'+time))
            : false
        });
      }
      d.setUTCDate(d.getUTCDate()+1);
    }

    for(let i=0;i<rows.length;i+=500){
      const {error}=await supabase
        .from('nakano_open_slots')
        .upsert(rows.slice(i,i+500),{onConflict:'slot_date,start_time'});
      if(error)throw error;
    }

    pushUndo(month+' '+(normal?'通常営業時間':'全部CLOSE'),beforeMonth);
    $('monthMsg').textContent=normal?'通常営業時間で設定しました。':'全部CLOSEにしました。';
  }catch(error){
    console.error(error);
    $('monthMsg').textContent='一括変更できませんでした。';
  }finally{
    busy=false;
  }

  if($('date').value.startsWith(month))await loadDay(false);
}


function renderDaySelector(){
  const month=$('blockedMonth').value;
  const box=$('daySelector');
  box.innerHTML='';
  if(!month)return;

  const dates=datesInMonth(month);
  if(!dates.length)return;

  const first=new Date(dates[0]+'T00:00:00').getDay();
  for(let i=0;i<first;i++)box.appendChild(document.createElement('span'));

  dates.forEach(date=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='dayButton'+(selectedBlockedDates.has(date)?' selected':'');
    button.textContent=String(Number(date.slice(-2)));
    button.onclick=()=>{
      if(selectedBlockedDates.has(date))selectedBlockedDates.delete(date);
      else selectedBlockedDates.add(date);
      renderDaySelector();
      renderSelectedDates();
    };
    box.appendChild(button);
  });

  renderSelectedDates();
}

function renderSelectedDates(){
  const dates=[...selectedBlockedDates].sort();
  $('selectedDatesBox').textContent=dates.length
    ? '選択中：'+dates.map(x=>Number(x.slice(5,7))+'月'+Number(x.slice(-2))+'日').join('・')
    : '日付を選択してください。';
}

async function saveBlocked(wholeDay=false){
  const dates=[...selectedBlockedDates].sort();
  if(!dates.length){
    $('blockedMsg').textContent='予約不可にする日を選択してください。';
    return;
  }

  let start=$('blockedStart').value;
  let end=$('blockedEnd').value;
  const memo=$('blockedMemo').value.trim();

  if(wholeDay){
    start='00:00:00';
    end='23:59:59';
  }else{
    if(!start||!end){
      $('blockedMsg').textContent='開始時間と終了時間を入力してください。';
      return;
    }
    if(end<=start){
      $('blockedMsg').textContent='終了時間は開始時間より後にしてください。';
      return;
    }
    start=start.length===5?start+':00':start;
    end=end.length===5?end+':00':end;
  }

  const rows=dates.map(date=>({
    blocked_date:date,
    start_time:start,
    end_time:end,
    memo:wholeDay?(memo?'終日：'+memo:'終日予約不可'):(memo||null)
  }));

  const {error}=await supabase.from('nakano_blocked_times').insert(rows);
  if(error){
    console.error(error);
    $('blockedMsg').textContent='登録できませんでした。';
    return;
  }

  $('blockedMsg').textContent=dates.length+'日分を登録しました。';
  selectedBlockedDates=new Set();
  $('blockedStart').value='';
  $('blockedEnd').value='';
  $('blockedMemo').value='';

  renderDaySelector();
  await loadMonthBlockedTimes();
  if(dates.includes($('date').value))await loadDay(false);
}

async function loadMonthBlockedTimes(){
  const month=$('blockedMonth').value;
  if(!month)return;

  const {data,error}=await supabase
    .from('nakano_blocked_times')
    .select('*')
    .gte('blocked_date',month+'-01')
    .lt('blocked_date',nextMonthStart(month))
    .order('blocked_date')
    .order('start_time');

  if(error){
    console.error(error);
    $('blockedList').innerHTML='<span class="msg">読み込めませんでした。</span>';
    return;
  }

  if(!data?.length){
    $('blockedList').innerHTML='<span class="msg">この月の設定はありません。</span>';
    return;
  }

  $('blockedList').innerHTML=data.map(item=>{
    const start=String(item.start_time).slice(0,5);
    const end=String(item.end_time).slice(0,5);
    const whole=start==='00:00'&&end.startsWith('23:59');
    return '<div class="blockedItem">'+
      '<strong>'+esc(item.blocked_date)+(whole?'　終日':'')+'</strong><br>'+
      (whole?'終日予約不可':esc(start)+' ～ '+esc(end))+
      (item.memo?'<br><span style="color:#7b7169">'+esc(item.memo)+'</span>':'')+
      '<br><button class="blockedDelete" type="button" data-id="'+esc(item.id)+'">解除</button>'+
      '</div>';
  }).join('');

  document.querySelectorAll('.blockedDelete').forEach(button=>{
    button.onclick=async()=>{
      if(!confirm('この予約不可設定を解除しますか？'))return;
      const {error}=await supabase.from('nakano_blocked_times').delete().eq('id',button.dataset.id);
      if(error){
        console.error(error);
        showToast('解除できませんでした');
        return;
      }
      await loadMonthBlockedTimes();
      await loadDay(false);
    };
  });
}

function shiftBlockedMonth(delta){
  const base=$('blockedMonth').value||monthFromDate($('date').value)||monthFromDate(todayJapan());
  const [year,mon]=base.split('-').map(Number);
  const d=new Date(Date.UTC(year,mon-1+delta,1));
  $('blockedMonth').value=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
  selectedBlockedDates=new Set();
  renderDaySelector();
  loadMonthBlockedTimes();
}

async function ensureAuth(){
  const {data,error}=await supabase.auth.getUser();
  if(error||!data?.user){
    location.replace('./admin.html?_adminv=20261015-compact-readable-v2');
    return false;
  }
  return true;
}

function initialDate(){
  const q=new URLSearchParams(location.search).get('date');
  if(/^\d{4}-\d{2}-\d{2}$/.test(q||''))return q;

  try{
    const state=JSON.parse(localStorage.getItem('nakano_admin_ui_state_v4')||'null');
    if(/^\d{4}-\d{2}-\d{2}$/.test(state?.date||''))return state.date;
  }catch(_){}

  return todayJapan();
}

$('prevDay').onclick=()=>{
  $('date').value=addDays($('date').value,-1);
  loadDay();
};
$('nextDay').onclick=()=>{
  $('date').value=addDays($('date').value,1);
  loadDay();
};
$('today').onclick=()=>{
  $('date').value=todayJapan();
  loadDay();
};
$('date').onchange=()=>{
  swipeGesture=null;
  clearRangePreview();
  loadDay();
};
$('undoBtn').onclick=undoLastChange;
$('normalHours').onclick=setNormalHours;
$('allClose').onclick=()=>setWholeDay(false);
$('monthNormal').onclick=()=>setMonth(true);
$('monthClose').onclick=()=>setMonth(false);
$('blockedPrevMonth').onclick=()=>shiftBlockedMonth(-1);
$('blockedNextMonth').onclick=()=>shiftBlockedMonth(1);
$('blockedMonth').onchange=()=>{
  selectedBlockedDates=new Set();
  renderDaySelector();
  loadMonthBlockedTimes();
};
$('addBlockedTime').onclick=()=>saveBlocked(false);
$('addBlockedDay').onclick=()=>saveBlocked(true);

bindSwipeGrid();
updateUndoButton();

if(await ensureAuth()){
  $('date').value=initialDate();
  $('month').value=monthFromDate($('date').value);
  $('blockedMonth').value=monthFromDate($('date').value);
  renderDaySelector();
  await Promise.all([loadDay(),loadMonthBlockedTimes()]);

  const params=new URLSearchParams(location.search);
  const planStart=params.get('planStart');
  const planEnd=params.get('planEnd');
  if(planStart){
    selectedBlockedDates=new Set([$('date').value]);
    $('blockedMonth').value=monthFromDate($('date').value);
    renderDaySelector();
    if(/^\d{2}:\d{2}$/.test(planStart))$('blockedStart').value=planStart;
    if(/^\d{2}:\d{2}$/.test(planEnd||''))$('blockedEnd').value=planEnd;
    $('blockedPanel').open=true;
    requestAnimationFrame(()=>$('blockedPanel').scrollIntoView({behavior:'smooth',block:'start'}));
  }
}
