name: patch date return scroll v2 once
on:
  push:
    paths:
      - '.github/workflows/patch-date-return-scroll-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch date return scroll
        run: python scripts/patch-date-return-scroll-v2.py
      - name: Verify
        run: |
          grep -q "setTimeout(scrollToDateCard,820)" index.html
          grep -q "fromcheck=1" body-check.html
          ! grep -q "fromcheck=1#date" body-check.html
      - name: Commit and cleanup
        run: |
          rm scripts/patch-date-return-scroll-v2.py
          rm .github/workflows/patch-date-return-scroll-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html body-check.html scripts/patch-date-return-scroll-v2.py .github/workflows/patch-date-return-scroll-v2-once.yml
          git commit -m "Refine diagnosis return scroll [skip ci]"
          git push
