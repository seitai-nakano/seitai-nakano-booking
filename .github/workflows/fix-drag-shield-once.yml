name: fix drag shield once
on:
  push:
    paths:
      - '.github/workflows/fix-drag-shield-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply drag shield fix
        run: python3 .github/scripts/fix_drag_shield.py
      - name: Verify syntax markers
        run: |
          grep -q 'blockedDragShield' blocked-drag.js
          grep -q 'scrollWidth-s.scroll.clientWidth' blocked-drag.js
          grep -q 'const EDGE_ZONE=120;' blocked-drag.js
      - name: Commit repair and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-drag-shield-once.yml
          git rm .github/scripts/fix_drag_shield.py
          git add admin.html bookings.html blocked-drag.js
          git commit -m 'Keep blocked drag scrolling beyond viewport [skip ci]'
          git push
