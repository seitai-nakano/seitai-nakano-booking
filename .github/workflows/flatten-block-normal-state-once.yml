name: flatten block normal state once
on:
  push:
    paths:
      - '.github/workflows/flatten-block-normal-state-once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply flat normal-state patch
        run: python .github/scripts/flatten_block_normal_state.py
      - name: Verify
        run: |
          grep -q "transform:none!important" blocked-drag.js
          grep -q "translateY(-4px) scale(1.025)" blocked-drag.js
      - name: Commit patch and cleanup
        run: |
          rm .github/scripts/flatten_block_normal_state.py .github/workflows/flatten-block-normal-state-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make blocked plans flat until long press [skip ci]"
          git push
