name: remove drag shield once
on:
  push:
    paths:
      - '.github/workflows/remove-drag-shield-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply drag shield rollback
        run: python3 .github/scripts/remove_drag_shield_capture_handle.py
      - name: Verify core markers
        run: |
          grep -q 'setPointerCapture' blocked-drag.js
          grep -q 'releasePointerCapture' blocked-drag.js
          ! grep -q 'blockedDragShield' blocked-drag.js
          grep -q 'scrollWidth-s.scroll.clientWidth' blocked-drag.js
      - name: Commit repair and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-drag-shield-once.yml
          git rm .github/scripts/remove_drag_shield_capture_handle.py
          git add blocked-drag.js
          git commit -m 'Restore blocked drag with handle pointer capture [skip ci]'
          git push
