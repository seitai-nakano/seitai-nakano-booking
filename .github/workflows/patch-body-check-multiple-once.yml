name: patch body check multiple once
on:
  push:
    paths:
      - '.github/workflows/patch-body-check-multiple-once.yml'
      - 'scripts/patch-body-check-multiple.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch multiple recommendations
        run: python scripts/patch-body-check-multiple.py
      - name: Verify
        run: |
          grep -q 'bodyCheckResultList' index.html
          grep -q 'おすすめ3' index.html || true
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/index-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/index-module.mjs
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show multiple recommended menus in body check'
          rm -f scripts/patch-body-check-multiple.py .github/workflows/patch-body-check-multiple-once.yml
          git add -A
          git commit -m 'Remove temporary body check multiple files [skip ci]'
          git push
