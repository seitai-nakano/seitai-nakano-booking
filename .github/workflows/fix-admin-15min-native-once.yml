name: fix admin 15 minute native once
on:
  push:
    paths:
      - '.github/workflows/fix-admin-15min-native-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply native 15-minute fix
        run: python3 .github/scripts/fix_admin_15min_native.py
      - name: Verify
        run: |
          grep -q '15分単位で受付可否を変更できます' admin.html
          grep -q 'minutes+=15' admin.html
          grep -q 'slotStart+15' admin.html
          grep -q 'manual-booking-v3-15min' admin.html
          grep -q 'nakano_admin_create_booking' admin.html
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-admin-15min-native-once.yml
          git rm .github/scripts/fix_admin_15min_native.py
          git add admin.html
          git commit -m 'Make admin OPEN CLOSE native 15-minute intervals [skip ci]'
          git push
