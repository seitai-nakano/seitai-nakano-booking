name: add admin timeline checkout links once
on:
  push:
    paths:
      - '.github/workflows/add-admin-checkout-link-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pages
        run: |
          python - <<'PY'
          from pathlib import Path
          changes=[]
          p=Path('admin.html');s=p.read_text();tag='<script type="module" src="./admin-checkout-link.js?v=20260910-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>');p.write_text(s);changes.append('admin.html')
          p=Path('checkout.html');s=p.read_text();tag='<script type="module" src="./checkout-deeplink.js?v=20260910-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>');p.write_text(s);changes.append('checkout.html')
          print(changes)
          PY
      - name: Verify
        run: |
          grep -q 'admin-checkout-link.js' admin.html
          grep -q 'checkout-deeplink.js' checkout.html
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html checkout.html
          git rm .github/workflows/add-admin-checkout-link-once.yml
          git commit -m 'Link admin schedule to checkout [skip ci]'
          git push