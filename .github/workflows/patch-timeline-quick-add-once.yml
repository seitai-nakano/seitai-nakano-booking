name: patch timeline quick add once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-timeline-quick-add-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timeline quick add
        run: python3 .github/patch-timeline-quick-add.py
      - name: Verify
        run: |
          grep -q "openTimelineQuickAdd" admin.html
          grep -q "timelineQuickBooking" admin.html
          grep -q "timelinePreferredTime" admin.html
          grep -q 'id="blockedStart"' admin.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('admin.html').read_text()
          assert 'step="900"' in s
          assert s.count('timelineQuickBooking') >= 2
          assert '<html' in s.lower() and '</html>' in s.lower()
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Add timeline tap actions for plans and manual bookings"
          git rm .github/patch-timeline-quick-add.py .github/workflows/patch-timeline-quick-add-once.yml
          git commit -m "Remove temporary timeline quick-add files [skip ci]"
          git push
