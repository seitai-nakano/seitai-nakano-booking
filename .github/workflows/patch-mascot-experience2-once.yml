name: patch mascot experience2 once
on:
  push:
    paths:
      - '.github/workflows/patch-mascot-experience2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mascot experience
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text()

          if 'id="bookingGuideAlways"' not in s:
              m='  <button class="bookingGuideMascotBtn" id="bookingGuideMascotBtn" type="button" aria-label="予約ナビを開く">'
              assert m in s
              s=s.replace(m,'  <div class="bookingGuideAlways" id="bookingGuideAlways">紹介してくれるなら、ぼくをタップしてね</div>\n'+m,1)

          css=r'''
          /* mascot interactive v2 */
          .bookingGuide{width:82px!important;min-height:82px;align-items:center!important;gap:0!important;transform:translate3d(var(--guide-dx,0px),var(--guide-dy,0px),0);transition:transform .06s linear;will-change:transform}
          .bookingGuideBubble{position:absolute!important;right:0;bottom:104px;width:min(300px,calc(100vw - 24px))!important;z-index:3}
          .bookingGuideAlways{position:absolute;right:0;bottom:91px;width:max-content;max-width:min(225px,calc(100vw - 108px));padding:8px 11px;border:1px solid #dccfc2;border-radius:13px 13px 4px 13px;background:rgba(248,241,234,.97);box-shadow:0 6px 18px rgba(83,53,38,.11);color:#6b302d;font-size:11px;line-height:1.45;font-weight:800;text-align:left;pointer-events:none;z-index:2;transition:opacity .14s ease,transform .14s ease}
          .bookingGuide.open .bookingGuideAlways{opacity:0;transform:translateY(4px)}
          .bookingGuide.guideLeft .bookingGuideBubble,.bookingGuide.guideLeft .bookingGuideAlways{left:0;right:auto}
          .bookingGuide.guideLeft .bookingGuideAlways{border-radius:13px 13px 13px 4px}
          .bookingGuide.guideTop .bookingGuideBubble{top:100px;bottom:auto}
          .bookingGuide.guideTop .bookingGuideAlways{top:91px;bottom:auto;border-radius:4px 13px 13px 13px}
          .bookingGuide.dragging{transition:none!important}
          .bookingGuide.dragging .bookingGuideMascotBtn{animation:none!important;transform:scale(1.08)!important;cursor:grabbing;box-shadow:0 12px 32px rgba(91,53,35,.27),inset 0 1px 0 rgba(255,255,255,.6)}
          .bookingGuide.dragging .bookingGuideMascot{animation:bookingMascotCarry .34s ease-in-out infinite alternate!important}
          .bookingGuideMascotBtn{touch-action:none!important;cursor:grab;user-select:none;-webkit-user-select:none}
          .bookingGuideShare{font-weight:900!important}
          @keyframes bookingMascotCarry{from{transform:translate3d(-3px,-4px,0) rotate(-7deg) scale(1.04)}to{transform:translate3d(3px,-10px,0) rotate(7deg) scale(1.08)}}
          @media(max-width:420px){.bookingGuideAlways{max-width:205px;font-size:10px}}
          '''
          if '/* mascot interactive v2 */' not in s:
              i=s.find('</style>')
              assert i>=0
              s=s[:i]+css+s[i:]

          js=r'''
          const BOOKING_GUIDE_DEFAULT_HINT='紹介してくれるなら、ぼくをタップしてね';
          let bookingGuideHintTimer=null;
          function bookingGuideHint(t=BOOKING_GUIDE_DEFAULT_HINT,ms=0){const e=$('bookingGuideAlways');if(!e)return;clearTimeout(bookingGuideHintTimer);e.textContent=t;if(ms)bookingGuideHintTimer=setTimeout(()=>e.textContent=BOOKING_GUIDE_DEFAULT_HINT,ms)}
          function bookingGuidePos(){const g=$('bookingGuide');return{x:parseFloat(g?.style.getPropertyValue('--guide-dx'))||0,y:parseFloat(g?.style.getPropertyValue('--guide-dy'))||0}}
          function bookingGuideSetPos(x,y){const g=$('bookingGuide');if(!g)return;g.style.setProperty('--guide-dx',`${Math.round(x)}px`);g.style.setProperty('--guide-dy',`${Math.round(y)}px`)}
          function bookingGuideSides(){const g=$('bookingGuide'),b=$('bookingGuideMascotBtn');if(!g||!b)return;const r=b.getBoundingClientRect();g.classList.toggle('guideLeft',r.left+r.width/2<innerWidth/2);g.classList.toggle('guideTop',r.top<145)}
          function bookingGuideRestore(){try{const v=JSON.parse(localStorage.getItem('nakano_booking_guide_pos_v1')||'null');if(v&&Number.isFinite(v.x)&&Number.isFinite(v.y))bookingGuideSetPos(v.x,v.y)}catch(_){}requestAnimationFrame(()=>{const b=$('bookingGuideMascotBtn');if(!b)return;const p=bookingGuidePos(),r=b.getBoundingClientRect(),m=8;let x=p.x,y=p.y;if(r.left<m)x+=m-r.left;if(r.right>innerWidth-m)x-=r.right-(innerWidth-m);if(r.top<m)y+=m-r.top;if(r.bottom>innerHeight-m)y-=r.bottom-(innerHeight-m);bookingGuideSetPos(x,y);bookingGuideSides()})}
          function bookingGuideDrag(g,b){
           let id=null,sx=0,sy=0,ox=0,oy=0,x0=0,x1=0,y0=0,y1=0,drag=false,last=0,n=0;
           const words=['よいしょ、よいしょ','ついていくよ','ここかな？','どこにする？','いっしょに行くね'];
           b.addEventListener('pointerdown',e=>{if(e.button!=null&&e.button!==0)return;id=e.pointerId;sx=e.clientX;sy=e.clientY;const p=bookingGuidePos();ox=p.x;oy=p.y;const r=b.getBoundingClientRect(),m=8;x0=ox+m-r.left;x1=ox+(innerWidth-m-r.right);y0=oy+m-r.top;y1=oy+(innerHeight-m-r.bottom);drag=false;last=0;n=0;clearTimeout(bookingGuideTimer);try{b.setPointerCapture(id)}catch(_){}});
           b.addEventListener('pointermove',e=>{if(id!==e.pointerId)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!drag&&Math.hypot(dx,dy)<7)return;drag=true;e.preventDefault();g.classList.add('dragging');g.classList.remove('open','thinking','done');bookingGuideSetPos(Math.min(x1,Math.max(x0,ox+dx)),Math.min(y1,Math.max(y0,oy+dy)));bookingGuideSides();const now=performance.now();if(now-last>520){bookingGuideHint(words[n++%words.length]);last=now}});
           const up=e=>{if(id!==e.pointerId)return;try{b.releasePointerCapture(id)}catch(_){}id=null;if(drag){drag=false;g.classList.remove('dragging');try{localStorage.setItem('nakano_booking_guide_pos_v1',JSON.stringify(bookingGuidePos()))}catch(_){}bookingGuideSides();bookingGuideHint('ここで待ってるね',1800);return}bookingGuideSides();const o=!g.classList.contains('open');g.classList.toggle('open',o);g.classList.remove('thinking','done')};
           b.addEventListener('pointerup',up);b.addEventListener('pointercancel',e=>{if(id!==e.pointerId)return;id=null;g.classList.remove('dragging');bookingGuideHint()});
          }
          function bookingGuideInit(){const g=$('bookingGuide'),b=$('bookingGuideMascotBtn'),sh=$('bookingGuideShare');if(!g||!b)return;if(manageToken){g.classList.add('hidden');return}if(sh)sh.onclick=shareSeitaiNakano;bookingGuideRestore();bookingGuideDrag(g,b);bookingGuideHint();addEventListener('resize',bookingGuideRestore,{passive:true})}
          '''
          if 'const BOOKING_GUIDE_DEFAULT_HINT=' not in s:
              i=s.rfind('</script>')
              assert i>=0
              s=s[:i]+js+s[i:]

          p.write_text(s)

          p=Path("body-check.html")
          s=p.read_text()
          css=r'''
          /* body check mascot v2 */
          .aiCompanion{position:relative;display:grid!important;grid-template-columns:106px minmax(0,1fr);align-items:center!important;gap:15px!important;margin:18px 0 7px!important;padding:15px 16px!important;border:1px solid #dfcfc2!important;border-radius:20px!important;background:linear-gradient(145deg,#fbf4ee 0%,#f3e5da 100%)!important;box-shadow:0 9px 26px rgba(83,53,38,.08);overflow:visible}
          .aiMascot{width:100px!important;height:130px!important;flex:0 0 100px!important;justify-self:center;animation:mascotFloatBig 2.45s ease-in-out infinite!important;will-change:transform}
          .aiStatus{position:relative;align-self:center;padding:13px 14px!important;border:1px solid #ddcec2;border-radius:17px 17px 17px 6px;background:#fffaf7;box-shadow:0 6px 18px rgba(83,53,38,.09);color:#554c46!important;font-size:13px!important;line-height:1.6!important;font-weight:800!important}
          .aiStatus:before{content:"";position:absolute;left:-10px;top:31px;width:18px;height:18px;background:#fffaf7;border-left:1px solid #ddcec2;border-bottom:1px solid #ddcec2;transform:rotate(45deg)}
          .aiStatusSmall{position:relative;z-index:1;margin-top:4px!important;color:#8a7e75!important;font-size:10px!important;line-height:1.5}
          .aiCompanion.thinking .aiMascot{animation:mascotThinkBig .42s ease-in-out infinite alternate!important}.aiCompanion.done .aiMascot{animation:mascotDoneBig .9s cubic-bezier(.2,.8,.3,1.2) 1,mascotFloatBig 2.45s .9s ease-in-out infinite!important}
          @keyframes mascotFloatBig{0%,100%{transform:translate3d(0,2px,0) rotate(-3deg) scale(1)}20%{transform:translate3d(4px,-5px,0) rotate(1deg) scale(1.02)}42%{transform:translate3d(-2px,-12px,0) rotate(4deg) scale(1.035)}64%{transform:translate3d(3px,-8px,0) rotate(-2deg) scale(1.02)}82%{transform:translate3d(-3px,-3px,0) rotate(-4deg) scale(1.01)}}
          @keyframes mascotThinkBig{from{transform:translate3d(-5px,-5px,0) rotate(-10deg) scale(1.04)}to{transform:translate3d(6px,-12px,0) rotate(10deg) scale(1.09)}}
          @keyframes mascotDoneBig{0%{transform:translateY(0) rotate(0) scale(1)}28%{transform:translateY(-20px) rotate(-8deg) scale(1.13)}52%{transform:translateY(-9px) rotate(8deg) scale(1.07)}74%{transform:translateY(3px) rotate(-4deg) scale(.98)}100%{transform:translateY(0) rotate(0) scale(1)}}
          @media(max-width:420px){.aiCompanion{grid-template-columns:92px minmax(0,1fr);gap:12px!important;padding:13px!important}.aiMascot{width:90px!important;height:118px!important;flex-basis:90px!important}.aiStatus{font-size:12px!important;padding:12px!important}}
          '''
          if '/* body check mascot v2 */' not in s:
              i=s.find('</style>')
              assert i>=0
              s=s[:i]+css+s[i:]
          s=s.replace("['mild','わからない・あまり感じない']","['mild','わからない・感じない']")
          s=s.replace('回答内容からおすすめを整理しています…','あなたに合いそうなコースをまとめています…')

          js=r'''
          let aiTalkStep=0;
          function setAiMood(mood,text){
           const box=$('aiCompanion');if(!box)return;
           if(text==='3つだけ質問します'){aiTalkStep=0;text='いっしょに見ていくね。3つだけ聞くよ'}
           else if(text==='回答を見ています…')text='ありがとう。回答を見てるよ…';
           else if(text==='次の質問です')text=aiTalkStep++===0?'ありがとう、次も教えてね':'いい感じに絞れてきたよ。あと1つ！';
           else if(text==='おすすめを整理しています…')text='あなたに合いそうなコースを考えてるよ…';
           else if(text==='おすすめがまとまりました')text='おすすめをまとめたよ。気になるものから選んでね';
           box.classList.remove('thinking','done');if(mood==='thinking')box.classList.add('thinking');if(mood==='done')box.classList.add('done');const t=$('aiStatusText');if(t&&text)t.textContent=text
          }
          '''
          if 'let aiTalkStep=0;' not in s:
              i=s.rfind('</script>')
              assert i>=0
              s=s[:i]+js+s[i:]
          s=s.replace('<span id="aiStatusText">3つだけ質問します</span><span class="aiStatusSmall">選んだ内容に合わせておすすめを絞ります</span>','<span id="aiStatusText">いっしょに見ていくね</span><span class="aiStatusSmall">3つの質問でおすすめを絞っていきます</span>')
          p.write_text(s)
          PY
          python3 /tmp/patch.py
      - name: Verify
        run: |
          grep -q 'id="bookingGuideAlways"' index.html
          grep -q 'BOOKING_GUIDE_DEFAULT_HINT' index.html
          grep -q 'bookingGuideDrag' index.html
          grep -q 'body check mascot v2' body-check.html
          grep -q 'aiTalkStep' body-check.html
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/patch-mascot-experience-once.yml .github/workflows/patch-mascot-experience2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html body-check.html .github/workflows/patch-mascot-experience-once.yml .github/workflows/patch-mascot-experience2-once.yml
          git commit -m 'Upgrade mascot interactions and body check companion [skip ci]'
          git push
