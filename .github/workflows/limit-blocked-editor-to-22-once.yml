name: limit blocked editor to 22 once
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/limit-blocked-editor-to-22.py'
      - '.github/workflows/limit-blocked-editor-to-22-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/limit-blocked-editor-to-22.py
      - name: Verify
        run: |
          grep -q "for(let n=DAY_START;n<=21\*60+45;n+=15)" booking-drag.js
          grep -q "for(let n=DAY_START+15;n<=22\*60;n+=15)" booking-drag.js
          grep -q "終了時間は22:00までにしてください" booking-drag.js
      - name: Commit patch and cleanup
        run: |
          rm .github/scripts/limit-blocked-editor-to-22.py
          rm .github/workflows/limit-blocked-editor-to-22-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booking-drag.js .github/scripts/limit-blocked-editor-to-22.py .github/workflows/limit-blocked-editor-to-22-once.yml
          git commit -m "Limit blocked editor times to 22:00 [skip ci]"
          git push
