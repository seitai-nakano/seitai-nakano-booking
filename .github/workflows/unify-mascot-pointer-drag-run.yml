name: unify-mascot-pointer-drag-run
on:
  push:
    paths:
      - '.github/workflows/unify-mascot-pointer-drag-run.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/unify_mascot_pointer_drag.py
      - run: |
          grep -q "'PointerEvent' in window" index.html
          grep -q "setPointerCapture" index.html
          grep -q "activePointerId" index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/unify-mascot-pointer-drag-run.yml
          git rm -f .github/workflows/unify-mascot-pointer-drag-once.yml
          git rm -f .github/scripts/unify_mascot_pointer_drag.py
          git add index.html
          git commit -m 'Unify mascot drag across mobile and desktop [skip ci]'
          git push
