name: unify manual and online bookings once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-manual-online-bookings-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch booking integration
        run: python3 .github/patch-unify-bookings.py
      - name: Verify
        run: |
          grep -q "p_customer_id" admin.html
          grep -q "customer-booking-unify.js" customers.html
          node --check customer-booking-unify.js
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html customers.html customer-booking-unify.js
          git commit -m "Unify manual and online booking histories"
          git rm .github/patch-unify-bookings.py .github/workflows/unify-manual-online-bookings-once.yml
          git commit -m "Remove temporary booking unify files [skip ci]"
          git push
