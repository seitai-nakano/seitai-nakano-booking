name: enable customer install once
on:
  push:
    paths:
      - '.github/workflows/enable-customer-install-once.yml'
      - '.github/scripts/enable_customer_install.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/enable_customer_install.py
      - name: Verify
        run: |
          grep -q 'rel="manifest"' index.html
          grep -q 'pwa-register.js?v=20260908-2' index.html
      - name: Commit patch and cleanup
        run: |
          rm -f .github/scripts/enable_customer_install.py .github/workflows/enable-customer-install-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enable easy add-to-home on customer booking [skip ci]' || exit 0
          git push
