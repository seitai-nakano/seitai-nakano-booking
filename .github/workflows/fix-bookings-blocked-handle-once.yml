name: fix bookings blocked handle once
on:
  push:
    paths:
      - '.github/workflows/fix-bookings-blocked-handle-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bookings blocked handle fix
        run: python3 .github/scripts/fix_bookings_blocked_handle.py
      - name: Verify patch
        run: |
          grep -q 'class="blockedMoveHandle"' bookings.html
          grep -q 'blocked-drag.js' bookings.html
          grep -q 'minute+=15' bookings.html
          grep -q 'block.dataset.blockedId' bookings.html
      - name: Commit repair and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-bookings-blocked-handle-once.yml
          git rm .github/scripts/fix_bookings_blocked_handle.py
          git add bookings.html
          git commit -m 'Add blocked move handle to bookings schedule [skip ci]'
          git push
