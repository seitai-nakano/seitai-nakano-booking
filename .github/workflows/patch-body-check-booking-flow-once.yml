name: patch body check booking flow once
on:
  push:
    paths:
      - '.github/workflows/patch-body-check-booking-flow-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch smoother booking flow
        run: python scripts/patch-body-check-booking-flow.py
      - name: Verify
        run: |
          grep -q "fromcheck=1#date" body-check.html
          grep -q "\$('date').scrollIntoView" index.html
          grep -q "このメニューで予約へ進む" body-check.html
      - name: Commit and cleanup
        run: |
          rm -f scripts/patch-body-check-booking-flow.py .github/workflows/patch-body-check-booking-flow-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Streamline body check to booking flow [skip ci]"
          git push
