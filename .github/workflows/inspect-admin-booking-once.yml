name: inspect admin booking once
on:
  push:
    paths:
      - '.github/workflows/inspect-admin-booking-once.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show booking UI snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('admin.html').read_text()
          keys=['bookingBlock','openBooking','editBooking','bookingEditor','selectedBooking','currentBooking','bookingDetail','bookingModal','editBtn']
          lines=s.splitlines()
          hits=set()
          for i,line in enumerate(lines):
              if any(k in line for k in keys):
                  for j in range(max(0,i-4),min(len(lines),i+8)):
                      hits.add(j)
          for j in sorted(hits):
              print(f'{j+1}: {lines[j]}')
          PY
      - name: Cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/inspect-admin-booking-once.yml
          git commit -m 'Remove admin booking inspector [skip ci]'
          git push