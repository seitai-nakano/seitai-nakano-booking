name: patch date scroll position once
on:
  push:
    paths:
      - '.github/workflows/patch-date-scroll-position-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch date scroll position
        run: python scripts/patch-date-scroll-position.py
      - name: Verify
        run: |
          grep -q "const dateCard=\$('date').closest('.card')" index.html
          grep -q "window.scrollTo({top,behavior:'smooth'})" index.html
      - name: Commit and cleanup
        run: |
          rm scripts/patch-date-scroll-position.py
          rm .github/workflows/patch-date-scroll-position-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/patch-date-scroll-position.py .github/workflows/patch-date-scroll-position-once.yml
          git commit -m "Align diagnosis return to date card [skip ci]"
          git push
