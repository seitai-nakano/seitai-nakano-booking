<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>整体なかの｜OPEN / CLOSE設定</title>
<style>
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:#f6f3ee;color:#2f2d2a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
main{max-width:720px;margin:auto;padding:12px 10px calc(24px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:30;margin:-12px -10px 10px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:rgba(246,243,238,.96);backdrop-filter:blur(10px);border-bottom:1px solid #e3dbd3}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-size:20px;font-weight:900;line-height:1.25}
.back{flex:0 0 auto;border:1px solid #d9cfc6;border-radius:11px;background:#fff;color:#514a44;padding:8px 10px;font-weight:800;text-decoration:none;font-size:12px}
.dateNav{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;margin-top:9px;align-items:center}
.navBtn{height:42px;border:1px solid #d9cfc6;border-radius:11px;background:#fff;color:#514a44;font-size:19px;font-weight:900}
.dateInput{height:42px;width:100%;border:1px solid #d9cfc6;border-radius:11px;background:#fff;color:#352f2b;padding:0 10px;font-weight:800;text-align:center;-webkit-appearance:none;appearance:none}
.quick{display:grid;grid-template-columns:1.25fr .9fr .62fr;gap:6px;margin-top:7px}
.quick button{min-height:40px;border-radius:11px;font-weight:900;padding:7px 8px}
.normalBtn{border:1px solid #61574d;background:#61574d;color:#fff}
.allCloseBtn{border:1px solid #d8aaa5;background:#fff8f7;color:#9b4138}
.todayBtn{border:1px solid #d9cfc6;background:#fff;color:#514a44}
.summary{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{padding:4px 7px;border-radius:999px;font-size:10px;font-weight:900}
.badge.open{background:#e7f3e9;color:#157842}
.badge.closed{background:#eae8e5;color:#77716a}
.badge.booking{background:#f0e8df;color:#65584e}
.badge.blocked{background:#f6dddd;color:#93483f}
.guide{margin:5px 0 8px;padding:7px 9px;border-radius:10px;background:#eee8e2;color:#6d625a;font-size:11px;line-height:1.5;text-align:center}
.guide strong:first-child{color:#168047}
.guide strong:last-child{color:#9b4138}
.hourGrid{display:block}
.hourRow{margin:6px 0;border:1px solid #ddd5cc;border-radius:13px;background:#fff;overflow:hidden}
.hourRowHead{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 8px;background:#f5f1ed;border-bottom:1px solid #ebe4dd}
.hourRowLabel{font-size:12px;font-weight:900;color:#514a44}
.hourRowState{font-size:9px;font-weight:900;color:#81766e}
.quarterGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:6px}
.quarterCard{position:relative;min-width:0;height:54px;border:1px solid #ddd5cc;border-radius:10px;overflow:hidden;background:#fff;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.quarterCard:before,.quarterCard:after{position:absolute;inset:0;display:flex;align-items:center;font-size:9px;font-weight:900;opacity:0;transition:opacity .1s}
.quarterCard:before{content:"→ OPEN";justify-content:flex-start;padding-left:5px;background:#dff0e4;color:#168047}
.quarterCard:after{content:"CLOSE ←";justify-content:flex-end;padding-right:5px;background:#f3dcd9;color:#9b4138}
.quarterCard.swipeOpen:before{opacity:1}
.quarterCard.swipeClose:after{opacity:1}
.quarterInner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fff;transition:transform .14s ease,background .14s ease}
.quarterCard.open .quarterInner{background:#edf7ef;color:#168047}
.quarterCard.closed .quarterInner{background:#f1f0ee;color:#7d7771}
.quarterTime{font-size:13px;font-weight:900;line-height:1}
.quarterState{font-size:8px;font-weight:900;line-height:1}
.quarterBusy{position:absolute;right:3px;top:3px;z-index:3;width:7px;height:7px;border-radius:50%;background:#9b4138;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.quarterCard.busySlot{border-color:#d2aaa5}
@media(max-width:340px){
  .quarterGrid{gap:4px;padding:5px}
  .quarterCard{height:51px}
  .quarterTime{font-size:12px}
}
@media(min-width:600px){
  .hourGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .hourRow{margin:0}
}
.toast{position:fixed;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));z-index:80;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:999px;background:#403934;color:#fff;font-size:12px;font-weight:800;transition:.18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.month{margin-top:10px;border:1px solid #ddd5cc;border-radius:13px;background:#fff;overflow:hidden}
.month summary{padding:11px 12px;font-size:12px;font-weight:900;cursor:pointer;list-style:none}
.month summary::-webkit-details-marker{display:none}
.monthInner{padding:0 11px 11px;border-top:1px solid #eee7df}
.monthInput{width:100%;height:43px;margin-top:9px;border:1px solid #ddd5cc;border-radius:10px;padding:0 9px;background:#fff;-webkit-appearance:none;appearance:none}
.monthActions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.monthActions button{min-height:42px;border-radius:10px;font-size:11px;font-weight:900}
.monthNormal{border:1px solid #61574d;background:#61574d;color:#fff}
.monthClose{border:1px solid #d8aaa5;background:#fff;color:#9b4138}
.msg{min-height:18px;margin-top:6px;font-size:11px;line-height:1.5;color:#7c7169}
.loading{padding:30px 10px;text-align:center;color:#7c7169}
@media(max-width:340px){
  .hourGrid{gap:5px}
  .hourCard{height:69px}
  .hourLabel{font-size:16px}
}
@media(min-width:600px){
  .hourGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="topline">
      <div class="title">OPEN / CLOSE設定</div>
      <a class="back" href="./admin.html">管理トップへ</a>
    </div>

    <div class="dateNav">
      <button class="navBtn" id="prevDay" type="button" aria-label="前日">‹</button>
      <input class="dateInput" id="date" type="date">
      <button class="navBtn" id="nextDay" type="button" aria-label="翌日">›</button>
    </div>

    <div class="quick">
      <button class="normalBtn" id="normalHours" type="button">通常 10:00〜20:00</button>
      <button class="allCloseBtn" id="allClose" type="button">全日CLOSE</button>
      <button class="todayBtn" id="today" type="button">今日</button>
    </div>

    <div class="summary" id="summary"></div>
  </div>

  <div class="guide"><strong>右スワイプ＝OPEN</strong>　／　<strong>左スワイプ＝CLOSE</strong>　（15分単位）</div>

  <div id="loading" class="loading">読み込んでいます…</div>
  <div id="hourGrid" class="hourGrid hidden"></div>

  <details class="month">
    <summary>月単位の一括設定</summary>
    <div class="monthInner">
      <input class="monthInput" id="month" type="month">
      <div class="monthActions">
        <button class="monthNormal" id="monthNormal" type="button">この月を通常営業時間</button>
        <button class="monthClose" id="monthClose" type="button">この月を全部CLOSE</button>
      </div>
      <div class="msg" id="monthMsg"></div>
    </div>
  </details>
</main>
<div class="toast" id="toast"></div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
  'https://scjzofjyxmchfjsngqtb.supabase.co',
  'sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9'
);

const DAY_START=8*60;
const DAY_END=22*60;
const hours=[];
for(let h=8;h<22;h++)hours.push(h);

let slots=[];
let bookings=[];
let blocked=[];
let busy=false;
let toastTimer=null;

const $=id=>document.getElementById(id);

function todayJapan(){
  const parts=new Intl.DateTimeFormat('en-US',{
    timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'
  }).formatToParts(new Date());
  const get=type=>parts.find(p=>p.type===type)?.value||'';
  return get('year')+'-'+get('month')+'-'+get('day');
}

function addDays(date,days){
  const parts=date.split('-').map(Number);
  const d=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}

function monthFromDate(date){
  return String(date||'').slice(0,7);
}

function nextMonthStart(month){
  const parts=month.split('-').map(Number);
  const d=new Date(Date.UTC(parts[0],parts[1],1));
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-01';
}

function hhmm(minutes){
  return String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0')+':00';
}

function toMinutes(time){
  const p=String(time||'00:00').slice(0,5).split(':').map(Number);
  return p[0]*60+p[1];
}

function showToast(text){
  clearTimeout(toastTimer);
  $('toast').textContent=text;
  $('toast').classList.add('show');
  toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1400);
}

function slotMap(){
  return new Map(slots.map(x=>[String(x.start_time),x]));
}

function busyAt(startMin,endMin){
  const bookingCount=bookings.filter(b=>{
    const s=toMinutes(b.start_time);
    const duration=Math.max(15,Number(b.minutes)||30);
    return s<endMin&&s+duration>startMin;
  }).length;

  const blockedCount=blocked.filter(b=>{
    const s=toMinutes(b.start_time);
    let e=toMinutes(b.end_time);
    if(String(b.end_time).startsWith('23:59'))e=24*60;
    return s<endMin&&e>startMin;
  }).length;

  return {bookingCount,blockedCount};
}

function stateForHour(hour){
  const map=slotMap();
  const quarter=[];
  for(let m=0;m<60;m+=15){
    const t=hhmm(hour*60+m);
    const open=!!map.get(t)?.is_open;
    const busyInfo=busyAt(hour*60+m,hour*60+m+15);
    quarter.push({
      time:t,
      open,
      busy:busyInfo.bookingCount>0||busyInfo.blockedCount>0
    });
  }
  const count=quarter.filter(x=>x.open).length;
  return {
    quarter,
    count,
    type:count===4?'allOpen':count===0?'allClosed':'mixed'
  };
}

function renderSummary(){
  const map=slotMap();
  let open=0,closed=0;
  for(let min=DAY_START;min<DAY_END;min+=15){
    if(map.get(hhmm(min))?.is_open)open++;
    else closed++;
  }
  $('summary').innerHTML=
    '<span class="badge open">OPEN '+open+'</span>'+
    '<span class="badge closed">CLOSE '+closed+'</span>'+
    '<span class="badge booking">予約 '+bookings.length+'</span>'+
    '<span class="badge blocked">予定 '+blocked.length+'</span>';
}

function render(){
  const grid=$('hourGrid');
  grid.innerHTML='';
  const map=slotMap();

  hours.forEach(hour=>{
    const row=document.createElement('div');
    row.className='hourRow';

    const head=document.createElement('div');
    head.className='hourRowHead';

    const label=document.createElement('div');
    label.className='hourRowLabel';
    label.textContent=hour+'時';

    const openCount=[0,15,30,45].filter(minute=>!!map.get(hhmm(hour*60+minute))?.is_open).length;
    const state=document.createElement('div');
    state.className='hourRowState';
    state.textContent=openCount===4?'全部OPEN':openCount===0?'全部CLOSE':openCount+'/4 OPEN';

    head.append(label,state);

    const quarterGrid=document.createElement('div');
    quarterGrid.className='quarterGrid';

    [0,15,30,45].forEach(minute=>{
      const total=hour*60+minute;
      const time=hhmm(total);
      const isOpen=!!map.get(time)?.is_open;
      const busyInfo=busyAt(total,total+15);
      const isBusy=busyInfo.bookingCount>0||busyInfo.blockedCount>0;

      const card=document.createElement('div');
      card.className='quarterCard '+(isOpen?'open':'closed')+(isBusy?' busySlot':'');
      card.dataset.time=time;

      const inner=document.createElement('div');
      inner.className='quarterInner';
      inner.innerHTML=
        '<div class="quarterTime">'+String(minute).padStart(2,'0')+'</div>'+
        '<div class="quarterState">'+(isOpen?'OPEN':'CLOSE')+'</div>';

      card.appendChild(inner);

      if(isBusy){
        const busyDot=document.createElement('span');
        busyDot.className='quarterBusy';
        busyDot.title=busyInfo.bookingCount?'予約あり':'予定あり';
        card.appendChild(busyDot);
      }

      bindQuarterSwipe(card,inner,time);
      quarterGrid.appendChild(card);
    });

    row.append(head,quarterGrid);
    grid.appendChild(row);
  });

  renderSummary();
  $('loading').classList.add('hidden');
  grid.classList.remove('hidden');
}

function bindQuarterSwipe(card,inner,time){
  let pointerId=null;
  let startX=0,startY=0;
  let dx=0;
  let horizontal=false;

  card.addEventListener('pointerdown',e=>{
    if(busy)return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    pointerId=e.pointerId;
    startX=e.clientX;
    startY=e.clientY;
    dx=0;
    horizontal=false;
    try{card.setPointerCapture(pointerId)}catch(_){}
  });

  card.addEventListener('pointermove',e=>{
    if(pointerId!==e.pointerId)return;
    const moveX=e.clientX-startX;
    const moveY=e.clientY-startY;

    if(!horizontal){
      if(Math.abs(moveY)>Math.abs(moveX)&&Math.abs(moveY)>7)return;
      if(Math.abs(moveX)>8)horizontal=true;
    }
    if(!horizontal)return;

    dx=Math.max(-48,Math.min(48,moveX));
    inner.style.transition='none';
    inner.style.transform='translateX('+dx+'px)';
    card.classList.toggle('swipeOpen',dx>6);
    card.classList.toggle('swipeClose',dx<-6);
  });

  const finish=async e=>{
    if(pointerId===null||e.pointerId!==pointerId)return;
    try{card.releasePointerCapture(pointerId)}catch(_){}
    pointerId=null;

    inner.style.transition='transform .14s ease,background .14s ease';
    card.classList.remove('swipeOpen','swipeClose');

    if(horizontal&&Math.abs(dx)>=28){
      const open=dx>0;
      inner.style.transform='translateX('+(open?58:-58)+'px)';
      await setQuarter(time,open);
    }else{
      inner.style.transform='translateX(0)';
    }
  };

  card.addEventListener('pointerup',finish);
  card.addEventListener('pointercancel',e=>{
    if(pointerId!==e.pointerId)return;
    pointerId=null;
    card.classList.remove('swipeOpen','swipeClose');
    inner.style.transition='transform .14s ease,background .14s ease';
    inner.style.transform='translateX(0)';
  });
}

async function setQuarter(time,open){
  if(busy)return;
  busy=true;
  const date=$('date').value;

  const {error}=await supabase
    .from('nakano_open_slots')
    .upsert(
      {slot_date:date,start_time:time,is_open:open},
      {onConflict:'slot_date,start_time'}
    );

  busy=false;

  if(error){
    console.error(error);
    showToast('変更できませんでした');
    await loadDay();
    return;
  }

  showToast(String(time).slice(0,5)+' を'+(open?'OPEN':'CLOSE'));
  await loadDay(false);
}

async function loadDay(showLoading=true){
  if(busy)return;
  const date=$('date').value;
  if(!date)return;

  if(showLoading){
    $('loading').classList.remove('hidden');
    $('hourGrid').classList.add('hidden');
  }

  const [slotResult,bookingResult,blockedResult]=await Promise.all([
    supabase.from('nakano_open_slots').select('start_time,is_open').eq('slot_date',date),
    supabase.from('nakano_bookings').select('id,start_time,minutes,status').eq('booking_date',date).eq('status','confirmed'),
    supabase.from('nakano_blocked_times').select('id,start_time,end_time').eq('blocked_date',date)
  ]);

  if(slotResult.error||bookingResult.error||blockedResult.error){
    console.error(slotResult.error,bookingResult.error,blockedResult.error);
    $('loading').textContent='読み込めませんでした。';
    $('loading').classList.remove('hidden');
    return;
  }

  slots=slotResult.data||[];
  bookings=bookingResult.data||[];
  blocked=blockedResult.data||[];

  $('month').value=monthFromDate(date);
  render();
}

async function setWholeDay(open){
  if(busy)return;
  busy=true;
  const date=$('date').value;
  const rows=[];
  for(let min=DAY_START;min<DAY_END;min+=15){
    rows.push({slot_date:date,start_time:hhmm(min),is_open:open});
  }
  const {error}=await supabase.from('nakano_open_slots').upsert(rows,{onConflict:'slot_date,start_time'});
  busy=false;
  if(error){
    console.error(error);
    showToast('変更できませんでした');
    return;
  }
  showToast(open?'全時間OPEN':'全日CLOSE');
  await loadDay(false);
}

async function setNormalHours(){
  if(busy)return;
  busy=true;
  const date=$('date').value;
  const rows=[];
  for(let min=DAY_START;min<DAY_END;min+=15){
    rows.push({
      slot_date:date,
      start_time:hhmm(min),
      is_open:min>=10*60&&min<20*60+15
    });
  }
  const {error}=await supabase.from('nakano_open_slots').upsert(rows,{onConflict:'slot_date,start_time'});
  busy=false;
  if(error){
    console.error(error);
    showToast('変更できませんでした');
    return;
  }
  showToast('通常営業時間に設定しました');
  await loadDay(false);
}

async function setMonth(normal){
  const month=$('month').value;
  if(!month||busy)return;

  const message=normal
    ? month+' を通常営業時間（10:00〜20:00）で設定しますか？'
    : month+' を全部CLOSEにしますか？';
  if(!confirm(message))return;

  busy=true;
  $('monthMsg').textContent='変更しています…';

  try{
    const start=month+'-01';
    const end=nextMonthStart(month);
    const d=new Date(start+'T00:00:00Z');
    const endDate=new Date(end+'T00:00:00Z');
    const rows=[];

    while(d<endDate){
      const date=d.toISOString().slice(0,10);
      for(let min=DAY_START;min<DAY_END;min+=15){
        rows.push({
          slot_date:date,
          start_time:hhmm(min),
          is_open:normal?(min>=10*60&&min<20*60+15):false
        });
      }
      d.setUTCDate(d.getUTCDate()+1);
    }

    for(let i=0;i<rows.length;i+=500){
      const {error}=await supabase
        .from('nakano_open_slots')
        .upsert(rows.slice(i,i+500),{onConflict:'slot_date,start_time'});
      if(error)throw error;
    }

    $('monthMsg').textContent=normal?'通常営業時間で設定しました。':'全部CLOSEにしました。';
  }catch(error){
    console.error(error);
    $('monthMsg').textContent='一括変更できませんでした。';
  }finally{
    busy=false;
  }

  if($('date').value.startsWith(month))await loadDay(false);
}

async function ensureAuth(){
  const {data,error}=await supabase.auth.getUser();
  if(error||!data?.user){
    location.replace('./admin.html');
    return false;
  }
  return true;
}

function initialDate(){
  const q=new URLSearchParams(location.search).get('date');
  if(/^\d{4}-\d{2}-\d{2}$/.test(q||''))return q;

  try{
    const state=JSON.parse(localStorage.getItem('nakano_admin_ui_state_v4')||'null');
    if(/^\d{4}-\d{2}-\d{2}$/.test(state?.date||''))return state.date;
  }catch(_){}

  return todayJapan();
}

$('prevDay').onclick=()=>{
  $('date').value=addDays($('date').value,-1);
  loadDay();
};
$('nextDay').onclick=()=>{
  $('date').value=addDays($('date').value,1);
  loadDay();
};
$('today').onclick=()=>{
  $('date').value=todayJapan();
  loadDay();
};
$('date').onchange=loadDay;
$('normalHours').onclick=setNormalHours;
$('allClose').onclick=()=>setWholeDay(false);
$('monthNormal').onclick=()=>setMonth(true);
$('monthClose').onclick=()=>setMonth(false);

if(await ensureAuth()){
  $('date').value=initialDate();
  $('month').value=monthFromDate($('date').value);
  await loadDay();
}
</script>
</body>
</html>
