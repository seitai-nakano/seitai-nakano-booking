name: fix duplicate blocked confirm once
on:
  push:
    paths:
      - '.github/scripts/fix_duplicate_block_confirm.py'
      - '.github/workflows/fix-duplicate-block-confirm-once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_duplicate_block_confirm.py
      - name: Verify
        run: |
          grep -q 'commitInFlight=true' blocked-drag.js
          grep -q 'ignorePointerUntil=Date.now()+2200' blocked-drag.js
      - name: Commit patch and cleanup
        run: |
          rm -f .github/scripts/fix_duplicate_block_confirm.py .github/workflows/fix-duplicate-block-confirm-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prevent duplicate blocked move confirmation [skip ci]'
          git push
