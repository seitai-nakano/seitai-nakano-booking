name: patch animated AI mascot once
on:
  push:
    paths:
      - '.github/workflows/patch-ai-mascot-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch body check mascot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('body-check.html')
          s=p.read_text()
          if 'id="aiCompanion"' in s:
              print('already patched')
          else:
              css='''\n.aiCompanion{display:flex;align-items:center;gap:12px;margin:15px 0 2px;padding:11px 13px;border:1px solid #e9e0d7;border-radius:16px;background:#fbf8f4}.aiMascot{width:64px;height:82px;flex:0 0 64px;transform-origin:50% 90%;animation:mascotFloat 3.2s ease-in-out infinite}.aiMascot svg{display:block;width:100%;height:100%;overflow:visible}.aiEye{transform-box:fill-box;transform-origin:center;animation:mascotBlink 4.6s infinite}.aiCheek{animation:mascotCheek 2.8s ease-in-out infinite}.aiStatus{min-width:0;color:#5f5852;font-size:12px;line-height:1.65;font-weight:700}.aiStatusSmall{display:block;margin-top:2px;color:#908880;font-size:10px;font-weight:600}.aiCompanion.thinking .aiMascot{animation:mascotThink .48s ease-in-out infinite alternate}.aiCompanion.thinking .aiCheek{animation:mascotCheekFast .7s ease-in-out infinite alternate}.aiCompanion.done .aiMascot{animation:mascotDone .72s cubic-bezier(.2,.8,.3,1.2) 1,mascotFloat 3.2s .72s ease-in-out infinite}@keyframes mascotFloat{0%,100%{transform:translateY(0) rotate(-.8deg)}50%{transform:translateY(-4px) rotate(.8deg)}}@keyframes mascotBlink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}@keyframes mascotCheek{0%,100%{opacity:.55}50%{opacity:1}}@keyframes mascotCheekFast{from{opacity:.45;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}@keyframes mascotThink{from{transform:translateY(-1px) rotate(-3deg)}to{transform:translateY(-3px) rotate(3deg)}}@keyframes mascotDone{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-8px) scale(1.04)}75%{transform:translateY(1px) scale(.99)}100%{transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){.aiMascot,.aiEye,.aiCheek,.aiCompanion.thinking .aiMascot,.aiCompanion.thinking .aiCheek,.aiCompanion.done .aiMascot{animation:none!important}}\n'''
              marker='.back{display:inline-block;margin:0 0 12px;color:#5e564f;font-size:13px;text-decoration:none}\n'
              if marker not in s: raise SystemExit('css marker missing')
              s=s.replace(marker,marker+css,1)
              html='''  <div class="aiCompanion" id="aiCompanion" aria-live="polite">\n    <div class="aiMascot" aria-hidden="true">\n      <svg viewBox="0 0 80 105" role="img">\n        <path d="M23 96V51c0-9 7-16 16-16h5c10 0 17-7 17-16C61 10 54 3 45 3H31C18 3 10 12 10 23c0 8 6 14 14 14 6 0 10-3 14-8 4-4 7-6 12-6 11 0 19 8 19 19v54Z" fill="#fff" stroke="#7b1e1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>\n        <ellipse class="aiCheek" cx="34" cy="75" rx="6" ry="2.6" fill="#f6cfe5"/>\n        <ellipse class="aiCheek" cx="58" cy="75" rx="6" ry="2.6" fill="#f6cfe5"/>\n        <circle class="aiEye" cx="40" cy="70" r="1.8" fill="#7b1e1b"/>\n        <circle class="aiEye" cx="52" cy="70" r="1.8" fill="#7b1e1b"/>\n        <path d="M44 77c1.6 1.7 3.4 1.7 5 0" fill="none" stroke="#7b1e1b" stroke-width="1.8" stroke-linecap="round"/>\n        <path d="M21 101h49" fill="none" stroke="#8c8a88" stroke-width="2" stroke-linecap="round"/>\n      </svg>\n    </div>\n    <div class="aiStatus"><span id="aiStatusText">3つだけ質問します</span><span class="aiStatusSmall">選んだ内容に合わせておすすめを絞ります</span></div>\n  </div>\n'''
              marker2='  <div class="lead">3つの質問に1つずつ答えると、おすすめのコースを3つご案内します。</div>\n'
              if marker2 not in s: raise SystemExit('html marker missing')
              s=s.replace(marker2,marker2+html,1)
              js='''function setAiMood(mood,text){\n  const box=$('aiCompanion');\n  if(!box)return;\n  box.classList.remove('thinking','done');\n  if(mood==='thinking')box.classList.add('thinking');\n  if(mood==='done')box.classList.add('done');\n  const t=$('aiStatusText');\n  if(t&&text)t.textContent=text;\n}\n'''
              marker3="const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);\n"
              if marker3 not in s: raise SystemExit('js marker missing')
              s=s.replace(marker3,marker3+js,1)
              old="  const q=questions[index];\n  if(!q){\n    $('questionArea').classList.add('hidden');"
              new="  const q=questions[index];\n  if(!q){\n    setAiMood('thinking','おすすめを整理しています…');\n    $('questionArea').classList.add('hidden');"
              if old not in s: raise SystemExit('showQuestion marker missing')
              s=s.replace(old,new,1)
              old2="      state[q.key]=value;\n      state.labels[index]=label;\n      setTimeout(()=>{"
              new2="      state[q.key]=value;\n      state.labels[index]=label;\n      setAiMood('thinking','回答を見ています…');\n      setTimeout(()=>{"
              if old2 not in s: raise SystemExit('answer marker missing')
              s=s.replace(old2,new2,1)
              old3="          showQuestion(index+1);\n          scrollToQuestion();"
              new3="          setAiMood('idle',index+1<questions.length?'次の質問です':'おすすめを整理しています…');\n          showQuestion(index+1);\n          scrollToQuestion();"
              if old3 not in s: raise SystemExit('next marker missing')
              s=s.replace(old3,new3,1)
              old4="function showResult(){\n  const ids=recommendations"
              new4="function showResult(){\n  setAiMood('done','おすすめがまとまりました');\n  const ids=recommendations"
              if old4 not in s: raise SystemExit('result marker missing')
              s=s.replace(old4,new4,1)
              old5="function start(){\n  state.concern='';state.severity='';state.approach='';state.labels=[];"
              new5="function start(){\n  setAiMood('idle','3つだけ質問します');\n  state.concern='';state.severity='';state.approach='';state.labels=[];"
              if old5 not in s: raise SystemExit('start marker missing')
              s=s.replace(old5,new5,1)
              p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'id="aiCompanion"' body-check.html
          grep -q 'mascotBlink' body-check.html
          grep -q "setAiMood('thinking','回答を見ています…')" body-check.html
      - name: Commit and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/patch-ai-mascot-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add body-check.html .github/workflows/patch-ai-mascot-once.yml
          git commit -m 'Animate AI mascot in body check [skip ci]'
          git push
