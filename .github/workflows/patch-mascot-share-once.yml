name: patch mascot share once
on:
  push:
    paths:
      - '.github/workflows/patch-mascot-share-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mascot share action
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Verify
        run: |
          grep -q 'id="bookingGuideShare"' index.html
          grep -q 'async function shareSeitaiNakano' index.html
          grep -q 'navigator.share' index.html
      - name: Commit and cleanup
        run: |
          rm .github/workflows/patch-mascot-share-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/patch-mascot-share-once.yml
          git commit -m 'Add share action to booking mascot [skip ci]'
          git push