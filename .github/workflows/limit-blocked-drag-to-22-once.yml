name: limit blocked drag to 22 once
on:
  push:
    paths:
      - '.github/workflows/limit-blocked-drag-to-22-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/limit_blocked_drag_to_22.py
      - name: Verify
        run: |
          grep -q 'const DAY_END=22\*60;' blocked-drag.js
          grep -q 'const maxStart=DAY_END-s.duration;' blocked-drag.js
      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/limit_blocked_drag_to_22.py
          rm .github/workflows/limit-blocked-drag-to-22-once.yml
          git add blocked-drag.js .github/scripts/limit_blocked_drag_to_22.py .github/workflows/limit-blocked-drag-to-22-once.yml
          git commit -m 'Limit blocked drag to 22:00 [skip ci]'
          git push
