name: fix admin schedule interactions once
on:
  push:
    paths:
      - '.github/workflows/fix-admin-schedule-interactions-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply admin schedule fixes
        run: python3 .github/scripts/fix_admin_schedule_interactions.py
      - name: Verify syntax and features
        run: |
          node --check booking-drag.js
          node --check blocked-drag.js
          grep -q "blockedInlineBook" booking-drag.js
          grep -q "nakano-admin-prefill-booking" booking-drag.js
          grep -q "touch-action:none;cursor:grab" blocked-drag.js
          grep -q "setPointerCapture(e.pointerId)" blocked-drag.js
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-admin-schedule-interactions-once.yml
          git rm .github/scripts/fix_admin_schedule_interactions.py
          git add booking-drag.js blocked-drag.js
          git commit -m 'Restore admin planned-item editing drag and booking override [skip ci]'
          git push
