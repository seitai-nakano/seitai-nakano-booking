name: bump pwa browser bridge once
on:
  push:
    paths:
      - '.github/workflows/bump-pwa-browser-bridge-once.yml'
      - '.github/scripts/bump_pwa_browser_bridge.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/bump_pwa_browser_bridge.py
      - name: Verify
        run: grep -q 'pwa-register.js?v=20260909-1' index.html
      - name: Commit patch and cleanup
        run: |
          rm -f .github/scripts/bump_pwa_browser_bridge.py .github/workflows/bump-pwa-browser-bridge-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use external Safari bridge for add-to-home [skip ci]' || exit 0
          git push
