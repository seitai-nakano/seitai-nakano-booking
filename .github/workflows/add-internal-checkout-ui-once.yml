name: add internal checkout ui once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-internal-checkout-ui-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checkout UI patch
        run: python .github/scripts/add_internal_checkout_ui.py
      - name: Verify
        run: |
          grep -q './checkout.html' admin.html
          grep -q 'accounting-analytics.js' analytics.html
      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html analytics.html
          git rm .github/scripts/add_internal_checkout_ui.py .github/workflows/add-internal-checkout-ui-once.yml
          git commit -m 'Integrate internal checkout UI [skip ci]'
          git push
