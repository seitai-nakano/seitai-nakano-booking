name: fix customer merge css once
on:
  push:
    paths:
      - '.github/workflows/fix-customer-merge-css-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .github/scripts/fix_customer_merge_css_once.py
      - name: Verify
        run: |
          grep -q '@media(max-width:480px){.mergeCompare{grid-template-columns:1fr}.row' customers.html
      - name: Commit fix and cleanup
        run: |
          rm -f .github/scripts/fix_customer_merge_css_once.py .github/workflows/fix-customer-merge-css-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix customer merge responsive CSS [skip ci]'
          git push
