name: cleanup customer id once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-customer-id-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup duplicate customer id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          old="""    p_memo:\n      $('memo')\n        .value\n        .trim()\n      ||\n      null,\n\n    p_customer_id:\n      $('customerSelect').value\n      ||\n      null\n\n  };"""
          new="""    p_memo:\n      $('memo')\n        .value\n        .trim()\n      ||\n      null\n\n  };"""
          if old not in s:
              raise SystemExit('duplicate target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('admin.html').read_text()
          block=s[s.index("$('addBooking').onclick="):s.index('/* ==========================\n   編集',s.index("$('addBooking').onclick="))]
          assert block.count('p_customer_id:') == 1
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Clean up customer booking linkage payload"
          git rm .github/workflows/cleanup-customer-id-once.yml
          git commit -m "Remove temporary customer id cleanup workflow [skip ci]"
          git push
